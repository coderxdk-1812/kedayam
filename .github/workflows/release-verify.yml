name: release-verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Unit + redteam + compatibility tests
        run: bun run test

      - name: Build + package + checksum the extension from current source
        run: node scripts/release-build.mjs

      - name: Re-certify against the freshly built zip
        run: node scripts/release-certify.mjs

      - name: Fail if the committed artifact has drifted from source
        run: |
          if ! git diff --exit-code -- public/kedayam.zip public/kedayam.zip.sha256 public/kedayam-release-cert.json; then
            echo "::error::Zip or cert has drifted from source. Run: node scripts/release-build.mjs && node scripts/release-certify.mjs and commit."
            exit 1
          fi
