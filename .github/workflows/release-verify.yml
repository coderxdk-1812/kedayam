name: release-verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install zip + unzip
        run: sudo apt-get install -y zip unzip

      - name: Lint (eslint + prettier)
        run: bun run lint

      - name: Validate extension (manifest, CSP, resources)
        run: bun run validate:extension

      - name: Unit + redteam + compatibility tests
        run: bun run test

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end extension tests
        run: bun run test:e2e

      # The committed zip is a checked-in binary; the `zip` CLI is not
      # byte-identical across macOS/Linux, so we verify its CONTENTS match source
      # (platform-independent) rather than requiring a byte-for-byte rebuild.
      - name: Verify committed artifact matches source (not stale)
        run: node scripts/verify-artifact.mjs

      # The release cert IS a pure function of source (no timestamps / live perf),
      # so it must reproduce exactly. Certify reads the committed zip for its hash.
      - name: Re-certify and fail on cert drift
        run: |
          node scripts/release-certify.mjs
          if ! git diff --exit-code -- public/kedayam-release-cert.json; then
            echo "::error::Release cert drifted. Run: node scripts/release-certify.mjs and commit."
            exit 1
          fi
