<!doctype html>
<!-- PingFederate hosted IdP. -->
<html lang="en"><head><meta charset="utf-8"><title>PingFederate Sign In</title></head>
<body>
<form action="https://sso.acme.com/idp/SSO.saml2" method="post">
  <h1>Sign On</h1>
  <input type="text" name="pf.username" placeholder="Username">
  <input type="password" name="pf.pass" placeholder="Password">
  <button type="submit">Sign On</button>
</form>
</body></html>
