<!doctype html>
<!-- Whitelabel Okta tenant — realistic enterprise IdP fixture. -->
<html lang="en"><head><meta charset="utf-8"><title>Sign in — Acme Corp</title>
<meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body>
<main>
  <img alt="Acme Corp" src="https://acme.okta.com/assets/img/logos/acme.svg" width="120">
  <h1>Sign in to Acme Corp</h1>
  <form action="https://acme.okta.com/api/v1/authn" method="post" autocomplete="on">
    <label>Username
      <input type="text" name="username" autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password">
    </label>
    <button type="submit">Sign in</button>
  </form>
  <a href="https://acme.okta.com/help/forgot_password">Forgot password?</a>
</main>
</body></html>
